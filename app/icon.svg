  <circle cx="122" cy="100" r="52" fill="none" stroke="#6B1420" stroke-width="16"/>
  <path d="M100,52.88 A52,52 0 0,1 100,147.12 A52,52 0 0,1 100,52.88 Z" fill="#D9A441"/>
</svg>
